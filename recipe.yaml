# Recipe for the modular-community channel (https://github.com/modular/modular-community).
# To publish: tag the release (git tag v0.1.0 && git push --tags), then copy this file
# to recipes/symspell/recipe.yaml in a fork of modular-community and open a pull request.
context:
  version: "0.1.0"
  mojo_version: ">=1.2.0, <1.3.0"

package:
  name: "symspell"
  version: ${{ version }}

source:
  - git: https://github.com/meequz/symspell.mojo.git
    tag: v${{ version }}

build:
  number: 0
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo
    - mojo precompile src/symspell -o ${{ PREFIX }}/lib/mojo/symspell.mojoc

requirements:
  host:
    - mojo-compiler ${{ mojo_version }}
  build:
    - mojo-compiler ${{ mojo_version }}
  run:
    - mojo-compiler ${{ mojo_version }}

tests:
  - script:
      - if: unix
        then:
          - mojo run examples/quick_start.mojo
    files:
      source:
        - examples/quick_start.mojo
        - data/
    requirements:
      run:
        - mojo ${{ mojo_version }}

about:
  homepage: https://github.com/meequz/symspell.mojo
  license: MIT
  license_file: LICENSE
  summary: Fast, memory-lean SymSpell spelling correction in pure Mojo, matching symspellpy.
  repository: https://github.com/meequz/symspell.mojo

extra:
  project_name: symspell
  maintainers:
    - meequz
